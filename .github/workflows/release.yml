name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-pack-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag '$tag' does not match package.json version '$pkg'"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build and run protocol e2e test
        run: npm test

      - name: Pack the plugin
        run: npm run pack

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: com.nicollasr.streamdeckvsc.mac.streamDeckPlugin
          body: |
            Version 6.0.1 is intentional: it prevents Stream Deck from automatically replacing this Node.js/TypeScript port with the legacy .NET build.
          generate_release_notes: false
